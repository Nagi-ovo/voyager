name: '🌠 功能需求 Feature Request'
description: '需求或建议 | Suggest an idea for Voyager'
title: '[Feature] '
labels: 'enhancement'
body:
  - type: markdown
    attributes:
      value: |
        ### 📢 关于 Feature Request | About Feature Requests

        **我们认为 Voyager 的功能已经足够充分且全面。** 引入过多个性化、小众的功能不会让软件更好用，反而会增加维护负担。因此，**除非你认为这个功能确实是急需的、大多数用户都会用到的，否则不建议提交 Feature Request。**

        **We believe Voyager's feature set is already comprehensive and well-rounded.** Adding too many niche or overly personalized features does not make the software better — it only increases the maintenance burden. Therefore, **unless you believe this feature is truly essential and would benefit the majority of users, please reconsider submitting this request.**

        ---

        ### ⚠️ 项目维护状态 | Maintenance Status

        **本项目目前处于低频维护模式。 | This project is currently in Low Maintenance mode.**

        - 无法保证能够投入精力，及时实现新的功能需求。 | The maintainer cannot guarantee they will be able to dedicate time to implement new features in a timely manner.
        - 我们非常**欢迎并鼓励社区贡献**！ | However, we **welcome and encourage community contributions**!
        - 如果您希望该功能被实现，提交高质量的 Pull Request 是最佳途径。编码前请先讨论并等待维护者明确同意方案；`/claim` 或被分配只代表负责人。 | A high-quality Pull Request is the best path to implementation. Before coding, discuss the approach and wait for explicit maintainer approval; `/claim` or assignment only selects an owner.
        - 使用 AI Agent（Claude Code、Codex 等）贡献时，请让它使用仓库自带的 `voyager-contribute` skill，可显著减少评审返工。 | If contributing with an AI agent (Claude Code, Codex, …), tell it to use the bundled `voyager-contribute` skill — it dramatically reduces review churn.
  - type: textarea
    attributes:
      label: '🥰 需求描述 | Feature Description'
      description: 'Please add a clear and concise description of the problem you are seeking to solve with this feature request.'
      placeholder: "Is your feature request related to a problem? Please describe.\nExample: I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    attributes:
      label: '🧐 解决方案 | Proposed Solution'
      description: "Describe the solution you'd like in a clear and concise manner."
      placeholder: 'Describe what you want to happen...'
    validations:
      required: true
  - type: textarea
    attributes:
      label: '✅ 验收标准 | Acceptance Criteria'
      description: 'Describe the smallest observable outcome that would make this request complete, including affected sites or browsers.'
      placeholder: |
        - On <site/browser>, when ...
        - Voyager should ...
        - Existing ... must remain unchanged
    validations:
      required: true
  - type: textarea
    attributes:
      label: '🔄 替代方案 | Alternatives Considered'
      description: 'Describe any alternative solutions or features you have considered.'
      placeholder: 'Describe alternative solutions...'
  - type: textarea
    attributes:
      label: '📝 补充信息 | Additional Information'
      description: 'REQUIRED for UI features: Please provide mockups or screenshots. / UI 功能必填：请提供设计图或截图。'
      placeholder: 'No screenshot = No reply (for UI features).'
  - type: checkboxes
    attributes:
      label: '💻 贡献意愿 | Contribution'
      options:
        - label: '我愿意为该功能贡献代码 / I am willing to contribute code for this feature'
        - label: '💡 若 Issue 未标记 `community-only`，其他贡献者可评论 `/claim` 认领 / Other contributors may use `/claim` unless the issue is labeled `community-only`'
